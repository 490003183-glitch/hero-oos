server {
    listen 80;
    server_name example.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hero-oos-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /health { default_type text/plain; return 200 "Hero OOS HTTPS setup\n"; }
    location / { return 404; }
}
