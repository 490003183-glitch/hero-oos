limit_req_zone $binary_remote_addr zone=hero_oos_api:10m rate=25r/s;
server {
    listen 80;
    server_name example.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hero-oos-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://example.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HeroOOS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 9m;
    client_body_timeout 20s;
    keepalive_timeout 30s;
    # Do not log usernames, query parameters, bodies, or bearer tokens.
    access_log off;
    location /updates/ {
        alias /var/www/hero-oos-updates/;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        limit_except GET { deny all; }
    }
    location ~ ^/(v1/|health$) {
        limit_req zone=hero_oos_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
    location / { return 404; }
}
